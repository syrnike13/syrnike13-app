name: Design CI

on:
  pull_request:
    paths:
      - packages/ui/**
      - apps/web/src/components/**
      - apps/web/src/features/**
      - apps/web/src/routes/**
      - apps/web/src/styles.css
      - apps/landing/src/**
      - apps/admin/src/**
      - tooling/eslint-plugin-design/**
      - eslint.config.mjs
      - .github/workflows/design-ci.yml
  push:
    branches:
      - develop
      - main
    paths:
      - packages/ui/**
      - apps/web/src/components/**
      - apps/web/src/features/**
      - apps/web/src/routes/**
      - apps/web/src/styles.css
      - apps/landing/src/**
      - apps/admin/src/**
      - tooling/eslint-plugin-design/**
      - eslint.config.mjs
      - .github/workflows/design-ci.yml

permissions:
  contents: read

concurrency:
  group: design-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:design:test
      - run: pnpm lint:design
