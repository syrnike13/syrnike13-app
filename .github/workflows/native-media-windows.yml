name: Windows Native Boundary

on:
  workflow_call:
    inputs:
      release_channel:
        description: Desktop release channel used by packaging.
        required: false
        type: string
        default: stable
      desktop_build_version:
        description: Desktop version embedded into staged hook addons.
        required: false
        type: string
        default: ""
      symbol_retention_days:
        description: Retention period for native debug symbols.
        required: false
        type: number
        default: 14
  pull_request:
    paths:
      - .github/workflows/native-media-windows.yml
      - apps/desktop/electron-builder.config.cjs
      - apps/desktop/package.json
      - apps/desktop/scripts/**
      - apps/desktop/src/main/native-runtime/**
      - apps/desktop/src/main/native-media-engine*
      - apps/desktop/src/main/media-runtime/**
      - apps/desktop/src/main/voice/**
      - apps/desktop/src/utility/**
      - apps/desktop/tsup*.ts
      - apps/web/src/features/desktop/native-media-runtime-banner*
      - docs/native-v2/**
      - docs/adr/0007-native-media-utility-lifetime.md
      - packages/desktop-native/**
      - packages/windows-media-engine/**
      - packages/native-media-lab/**
      - services/livekit-server/**
      - packages/platform/src/media*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-boundary:
    name: Hook addons and media lifecycle boundary
    runs-on: windows-2025-vs2026
    env:
      SYRNIKE_DESKTOP_CHANNEL: ${{ inputs.release_channel || 'stable' }}
      SYRNIKE_DESKTOP_BUILD_VERSION: ${{ inputs.desktop_build_version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/livekit-server/go.mod
          cache-dependency-path: services/livekit-server/go.sum
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test Debug media lifecycle engine
        run: |
          pnpm windows-media:build:debug
          pnpm windows-media:test:debug
      - name: Build, test, and verify Release media lifecycle engine
        run: |
          pnpm windows-media:build
          pnpm windows-media:test
          pnpm windows-media:probe
          pnpm windows-media:verify
      - name: Build and test Debug hook addons
        run: |
          pnpm desktop-native:build:debug
          pnpm desktop-native:test:debug
      - name: Build, test, and verify Release hook addons
        run: |
          pnpm desktop-native:build
          pnpm desktop-native:test
          pnpm desktop-native:verify
          pnpm --filter @syrnike13/desktop-native smoke:hooks
      - name: Verify desktop boundary
        run: |
          pnpm desktop:typecheck
          pnpm desktop:test
      - name: Build desktop assets for package
        run: pnpm desktop:build
      - name: Run 50-cycle Electron media lifecycle smoke
        run: pnpm --filter @syrnike13/desktop smoke:media-lifecycle
      - name: Build local LiveKit server for the Media Lab
        working-directory: services/livekit-server
        run: |
          New-Item -ItemType Directory -Force -Path ..\..\packages\native-media-lab\.ci | Out-Null
          go build -o ..\..\packages\native-media-lab\.ci\livekit-server.exe ./cmd/server
      - name: Run Native v2 Media Lab through Engine room control
        env:
          MEDIA_LAB_SERVER_EXE: ${{ github.workspace }}\packages\native-media-lab\.ci\livekit-server.exe
        run: pnpm native-media:lab
      - name: Build and verify unpacked Windows package
        run: pnpm --filter @syrnike13/desktop package:prepared
      - name: Upload verified Windows hook addons
        uses: actions/upload-artifact@v4
        with:
          name: native-hooks-windows-${{ inputs.release_channel || 'stable' }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            packages/desktop-native/dist/win32-x64/**
            apps/desktop/out/native/win32-x64/**
      - name: Upload verified Windows media lifecycle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-windows-${{ inputs.release_channel || 'stable' }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            packages/windows-media-engine/dist/win32-x64/**
            apps/desktop/out/media-native/win32-x64/**
      - name: Upload Native v2 Media Lab report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-v2-media-lab-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: packages/native-media-lab/artifacts/latest-report.json
      - name: Upload native debug symbols
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-hooks-windows-symbols-${{ github.sha }}
          if-no-files-found: warn
          retention-days: ${{ inputs.symbol_retention_days || 14 }}
          path: |
            packages/desktop-native/build/**/*.pdb
            packages/desktop-native/dist/win32-x64/native-manifest.json
      - name: Upload media lifecycle debug symbols
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-windows-symbols-${{ github.sha }}
          if-no-files-found: warn
          retention-days: ${{ inputs.symbol_retention_days || 14 }}
          path: |
            packages/windows-media-engine/build/**/*.pdb
            packages/windows-media-engine/build/Release/media_probe.exe
            packages/windows-media-engine/dist/win32-x64/media-manifest.json

  native-hooks-asan:
    name: Hook addons AddressSanitizer
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test Debug hook addons with AddressSanitizer
        run: |
          pnpm desktop-native:build:asan
          pnpm desktop-native:test:debug
          pnpm windows-media:build:asan
          pnpm windows-media:test:debug
