name: syrnike13-nightly

x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  database:
    # Data files are at featureCompatibilityVersion 8.2; MongoDB 9 refuses to
    # start on them. Upgrade only deliberately (setFeatureCompatibilityVersion).
    image: docker.io/mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    logging: *json-log-rotation
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    restart: always
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok === 1 && db.hello().isWritablePrimary } catch (err) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]}); false }' | grep -q true
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: docker.io/eqalpha/keydb
    logging: *json-log-rotation
    restart: always

  rabbit:
    image: docker.io/rabbitmq:4
    logging: *json-log-rotation
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    image: ghcr.io/syrnike13/app-api:nightly
    # Rust binaries run as PID 1 without signal handlers; the init process
    # forwards SIGTERM so restarts do not wait out the 10s stop timeout.
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.beta.syrnike13.ru
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-api
    restart: always

  events:
    image: ghcr.io/syrnike13/app-events:nightly
    # Covers the gateway handing its clients over to a replacement process.
    stop_grace_period: 45s
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.beta.syrnike13.ru
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-events
    restart: always

  autumn:
    image: ghcr.io/syrnike13/app-file-server:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-autumn
    restart: always

  january:
    image: ghcr.io/syrnike13/app-proxy:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-january
    restart: always

  gifbox:
    image: ghcr.io/syrnike13/app-gifbox:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-gifbox
    restart: always

  # Activity Origins proxy (ADR-0011): serves {id}.activities.beta.syrnike13.ru.
  # Caddy's on-demand TLS questions reach it through the production proxy.
  activity-proxy:
    image: ghcr.io/syrnike13/app-activity-proxy:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.beta.syrnike13.ru
      # The desktop renderer is served from 127.0.0.1 on a random port.
      SYRNIKE__ACTIVITIES__CLIENT_ORIGINS: https://app.beta.syrnike13.ru http://127.0.0.1:*
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-activity-proxy
    restart: always

  crond:
    image: ghcr.io/syrnike13/app-crond:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  pushd:
    image: ghcr.io/syrnike13/app-pushd:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  voice-ingress:
    image: ghcr.io/syrnike13/app-voice-ingress:nightly
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-voice-ingress
    restart: always

  livekit:
    image: ghcr.io/syrnike13/app-livekit-server:nightly
    logging: *json-log-rotation
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "7882:7882"
      - "3479:3479/udp"
      - "30101-30200:30101-30200/udp"
      - "50101-50200:50101-50200/udp"
    volumes:
      - type: bind
        source: ./livekit.yml
        target: /etc/livekit.yml
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-livekit
    restart: always

  # Second LiveKit node, so a LiveKit update drains one node while the other
  # takes new rooms. Enable with COMPOSE_PROFILES=livekit-b in the server-local
  # .env after opening its ports (docs/deployment.md, "Two LiveKit nodes").
  livekit-b:
    image: ghcr.io/syrnike13/app-livekit-server:nightly
    profiles: ["livekit-b"]
    logging: *json-log-rotation
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "${LIVEKIT_B_TCP_PORT:-7884}:${LIVEKIT_B_TCP_PORT:-7884}"
      - "${LIVEKIT_B_TURN_UDP_PORT:-3481}:${LIVEKIT_B_TURN_UDP_PORT:-3481}/udp"
      - "${LIVEKIT_B_TURN_RELAY_RANGE_START:-30301}-${LIVEKIT_B_TURN_RELAY_RANGE_END:-30400}:${LIVEKIT_B_TURN_RELAY_RANGE_START:-30301}-${LIVEKIT_B_TURN_RELAY_RANGE_END:-30400}/udp"
      - "${LIVEKIT_B_RTC_PORT_RANGE_START:-50301}-${LIVEKIT_B_RTC_PORT_RANGE_END:-50400}:${LIVEKIT_B_RTC_PORT_RANGE_START:-50301}-${LIVEKIT_B_RTC_PORT_RANGE_END:-50400}/udp"
    volumes:
      - type: bind
        source: ./livekit-b.yml
        target: /etc/livekit.yml
    networks:
      default:
        aliases:
          - livekit
      edge:
        aliases:
          - syrnike13-nightly-livekit
    restart: always

  # Landing site
  landing:
    image: ghcr.io/syrnike13/app-landing:nightly
    logging: *json-log-rotation
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-landing
    restart: always

  web:
    image: ghcr.io/syrnike13/app-web:nightly
    # Keeps hashed assets of previous builds for tabs opened before a deploy.
    environment:
      ASSET_ARCHIVE_DIR: /asset-archive
    volumes:
      - ./data/web-assets:/asset-archive
    logging: *json-log-rotation
    env_file: .env.web
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-web
    restart: always

  admin:
    image: ghcr.io/syrnike13/app-admin:nightly
    environment:
      ASSET_ARCHIVE_DIR: /asset-archive
    volumes:
      - ./data/admin-assets:/asset-archive
    logging: *json-log-rotation
    env_file: .env.web
    networks:
      default:
      edge:
        aliases:
          - syrnike13-nightly-admin
    restart: always

networks:
  edge:
    name: "${SYRNIKE_EDGE_NETWORK:-syrnike13-edge}"
    external: true
