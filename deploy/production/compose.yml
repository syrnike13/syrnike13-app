name: syrnike13

x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # MongoDB: Database
  database:
    # Data files are at featureCompatibilityVersion 8.2; MongoDB 9 refuses to
    # start on them. Upgrade only deliberately (setFeatureCompatibilityVersion).
    image: docker.io/mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    logging: *json-log-rotation
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    restart: always
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok === 1 && db.hello().isWritablePrimary } catch (err) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]}); false }' | grep -q true
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/eqalpha/keydb
    command: ["keydb-server", "/etc/keydb/keydb.conf", "--save", ""]
    logging: *json-log-rotation
    restart: always

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    logging: *json-log-rotation
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Caddy: Web server
  caddy:
    image: docker.io/caddy
    logging: *json-log-rotation
    restart: always
    env_file: .env.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
      - ./data/desktop:/srv/desktop:ro
    networks:
      default:
        aliases:
         - "${SYRNIKE_DOMAIN:-caddy}"
      edge:

  # API server
  api:
    image: ghcr.io/syrnike13/app-api:latest
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Events service
  events:
    image: ghcr.io/syrnike13/app-events:latest
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # File server
  autumn:
    image: ghcr.io/syrnike13/app-file-server:latest
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Metadata and image proxy
  january:
    image: ghcr.io/syrnike13/app-proxy:latest
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Tenor proxy
  gifbox:
    image: ghcr.io/syrnike13/app-gifbox:latest
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Regular task daemon
  crond:
    image: ghcr.io/syrnike13/app-crond:latest
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/syrnike13/app-pushd:latest
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

   # Voice ingress daemon
  voice-ingress:
    image: ghcr.io/syrnike13/app-voice-ingress:latest
    logging: *json-log-rotation
    env_file: secrets.env
    restart: always
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml

  livekit:
    image: ghcr.io/syrnike13/app-livekit-server:latest
    logging: *json-log-rotation
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "30000-30100:30000-30100/udp"
      - "50000-50100:50000-50100/udp"
    restart: always
    volumes:
      - type: bind
        source: ./livekit.yml
        target: /etc/livekit.yml

  # Landing site
  landing:
    image: ghcr.io/syrnike13/app-landing:latest
    logging: *json-log-rotation
    networks:
      default:
      edge:
        aliases:
          - syrnike13-landing
    restart: always

  # Web App
  web:
    image: ghcr.io/syrnike13/app-web:latest
    logging: *json-log-rotation
    restart: always
    env_file: .env.web

  # Admin App
  admin:
    image: ghcr.io/syrnike13/app-admin:latest
    logging: *json-log-rotation
    restart: always
    env_file: .env.web

networks:
  edge:
    name: "${SYRNIKE_EDGE_NETWORK:-syrnike13-edge}"
    external: true
