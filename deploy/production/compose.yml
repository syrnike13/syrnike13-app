name: syrnike13

x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # MongoDB: Database
  database:
    # Data files are at featureCompatibilityVersion 8.2; MongoDB 9 refuses to
    # start on them. Upgrade only deliberately (setFeatureCompatibilityVersion).
    image: docker.io/mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    logging: *json-log-rotation
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    restart: always
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok === 1 && db.hello().isWritablePrimary } catch (err) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]}); false }' | grep -q true
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/eqalpha/keydb
    command: ["keydb-server", "/etc/keydb/keydb.conf", "--save", ""]
    logging: *json-log-rotation
    restart: always

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    logging: *json-log-rotation
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Caddy: Web server
  caddy:
    image: docker.io/caddy
    logging: *json-log-rotation
    restart: always
    env_file: .env.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
      - ./data/desktop:/srv/desktop:ro
      - ./data/mobile:/srv/mobile:ro
    networks:
      default:
        aliases:
         - "${SYRNIKE_DOMAIN:-caddy}"
      edge:

  # API server
  api:
    image: ghcr.io/syrnike13/app-api:latest
    # Rust binaries run as PID 1 without signal handlers; the init process
    # forwards SIGTERM so restarts do not wait out the 10s stop timeout.
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.syrnike13.ru
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-api

  # Events service
  events:
    image: ghcr.io/syrnike13/app-events:latest
    # Covers the gateway handing its clients over to a replacement process.
    stop_grace_period: 45s
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.syrnike13.ru
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-events

  # File server
  autumn:
    image: ghcr.io/syrnike13/app-file-server:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-autumn

  # Metadata and image proxy
  january:
    image: ghcr.io/syrnike13/app-proxy:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-january

  # Tenor proxy
  gifbox:
    image: ghcr.io/syrnike13/app-gifbox:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-gifbox

  # Activity Origins proxy (ADR-0011): serves {id}.activities.syrnike13.ru
  # and answers Caddy's on-demand TLS question. Questions about nightly hosts
  # go through Caddy's internal :14700 relay to the nightly proxy.
  activity-proxy:
    image: ghcr.io/syrnike13/app-activity-proxy:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    environment:
      SYRNIKE__HOSTS__ACTIVITIES: https://{id}.activities.syrnike13.ru
      # The desktop renderer is served from 127.0.0.1 on a random port.
      SYRNIKE__ACTIVITIES__CLIENT_ORIGINS: https://app.syrnike13.ru http://127.0.0.1:*
      SYRNIKE__ACTIVITIES__ASK_DELEGATE_SUFFIX: .activities.beta.syrnike13.ru
      SYRNIKE__ACTIVITIES__ASK_DELEGATE_URL: http://caddy:14700/_caddy/ask
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always
    # Only on the default network: first-party applications reach the web
    # service as http://web:5000, which must not resolve to the nightly one.
    networks:
      default:
        aliases:
          - syrnike13-activity-proxy

  # Regular task daemon
  crond:
    image: ghcr.io/syrnike13/app-crond:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/syrnike13/app-pushd:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml
    restart: always

   # Voice ingress daemon
  voice-ingress:
    image: ghcr.io/syrnike13/app-voice-ingress:latest
    init: true
    logging: *json-log-rotation
    env_file: secrets.env
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-voice-ingress
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Syrnike.toml
        target: /Syrnike.toml

  livekit:
    image: ghcr.io/syrnike13/app-livekit-server:latest
    logging: *json-log-rotation
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "30000-30100:30000-30100/udp"
      - "50000-50100:50000-50100/udp"
    restart: always
    volumes:
      - type: bind
        source: ./livekit.yml
        target: /etc/livekit.yml

  # Second LiveKit node, so a LiveKit update drains one node while the other
  # takes new rooms. Enable with COMPOSE_PROFILES=livekit-b in the server-local
  # .env after opening its ports (docs/deployment.md, "Two LiveKit nodes").
  livekit-b:
    image: ghcr.io/syrnike13/app-livekit-server:latest
    profiles: ["livekit-b"]
    logging: *json-log-rotation
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "${LIVEKIT_B_TCP_PORT:-7883}:${LIVEKIT_B_TCP_PORT:-7883}"
      - "${LIVEKIT_B_TURN_UDP_PORT:-3480}:${LIVEKIT_B_TURN_UDP_PORT:-3480}/udp"
      - "${LIVEKIT_B_TURN_RELAY_RANGE_START:-30201}-${LIVEKIT_B_TURN_RELAY_RANGE_END:-30300}:${LIVEKIT_B_TURN_RELAY_RANGE_START:-30201}-${LIVEKIT_B_TURN_RELAY_RANGE_END:-30300}/udp"
      - "${LIVEKIT_B_RTC_PORT_RANGE_START:-50201}-${LIVEKIT_B_RTC_PORT_RANGE_END:-50300}:${LIVEKIT_B_RTC_PORT_RANGE_START:-50201}-${LIVEKIT_B_RTC_PORT_RANGE_END:-50300}/udp"
    volumes:
      - type: bind
        source: ./livekit-b.yml
        target: /etc/livekit.yml
    networks:
      default:
        aliases:
          - livekit
          - syrnike13-livekit
    restart: always

  # Landing site
  landing:
    image: ghcr.io/syrnike13/app-landing:latest
    logging: *json-log-rotation
    networks:
      default:
      edge:
        aliases:
          - syrnike13-landing
    restart: always

  # Web App
  web:
    image: ghcr.io/syrnike13/app-web:latest
    # Keeps hashed assets of previous builds for tabs opened before a deploy.
    environment:
      ASSET_ARCHIVE_DIR: /asset-archive
    volumes:
      - ./data/web-assets:/asset-archive
    logging: *json-log-rotation
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-web
    env_file: .env.web

  # Admin App
  admin:
    image: ghcr.io/syrnike13/app-admin:latest
    environment:
      ASSET_ARCHIVE_DIR: /asset-archive
    volumes:
      - ./data/admin-assets:/asset-archive
    logging: *json-log-rotation
    restart: always
    networks:
      default:
        aliases:
          - syrnike13-admin
    env_file: .env.web

networks:
  edge:
    name: "${SYRNIKE_EDGE_NETWORK:-syrnike13-edge}"
    external: true
